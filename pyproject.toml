[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reqtap"
version = "0.0.1"
description = "A development-time wiretap for capturing and inspecting web application traffic."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joshua Ng" }]
keywords = ["debugging", "http", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jxcg/reqtap"
Source = "https://github.com/jxcg/reqtap"
Issues = "https://github.com/jxcg/reqtap/issues"

[project.optional-dependencies]
# Flask is an optional extra: the core package has zero hard dependencies, so
# `import reqtap` works without it. The Flask adapter (the only one in v0.1)
# needs it, hence `pip install reqtap[flask]`.
flask = ["flask>=3.0"]
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.4", "flask>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/reqtap"]

# The sdist otherwise picks up any file git does not ignore, including ones
# tracked in the repo. Kept separate from .gitignore so a tracked file like
# CLAUDE.md still stays out of a release.
[tool.hatch.build.targets.sdist]
exclude = [".codex", ".cursor", ".claude", "CLAUDE.md", "AGENTS.md", "GEMINI.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
# The dashboard UI ships as data files, not importable modules.
exclude = ["src/reqtap/dashboard/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Show log output live during test runs, and give later log-assertion tests a
# consistent format to read. The `caplog` fixture captures records regardless;
# these settings just make logs visible while developing tests.
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
