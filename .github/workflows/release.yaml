name: release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted Publishing: PyPI verifies this workflow's OIDC token, so there
    # is no API token to store or leak.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Dashboard UI is packaged
        run: python scripts/check_wheel_contents.py
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
