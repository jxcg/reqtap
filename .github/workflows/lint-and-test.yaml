name: verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies (Lint)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Lint
        run: |
          ruff check src
          ruff check tests

      - name: Mypy (type check)
        run: |
            mypy src
            mypy tests

      - name: Run Test
        run: python -m pytest

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Dashboard UI is packaged
        run: python scripts/check_wheel_contents.py

  verification-gate:
    needs: [lint-and-test, packaging]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail unless every job succeeded
        if: needs.lint-and-test.result != 'success' || needs.packaging.result != 'success'
        run: exit 1
