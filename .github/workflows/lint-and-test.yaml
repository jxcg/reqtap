name: verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Dependencies (Lint)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Lint
        run: |
          mypy .
          ruff check
      - name: Run Test
        run: python -m pytest
