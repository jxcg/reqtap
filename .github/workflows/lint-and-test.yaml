name: verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first failing version cancels the others and hides
      # whether the break is version-specific or universal.
      fail-fast: false
      matrix:
        # Every version pyproject.toml's requires-python claims to support.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies (Lint)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Lint
        run: ruff check src

      - name: Mypy (type check)
        run: mypy src

      - name: Run Test
        run: python -m pytest

  # Branch protection matches status checks by exact name, but matrix jobs
  # report one context per leg ("lint-and-test (3.11)", ...). Requiring those
  # directly means editing the ruleset every time a Python version changes, and
  # forgetting to leaves that version silently ungated. This job exists only to
  # give the ruleset one stable name to require.
  verification-gate:
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Without always(), a failing matrix skips this job, so it never reports and
    # the PR waits forever instead of showing a failure.
    if: always()
    steps:
      # always() would otherwise let this job pass on its own emptiness. The
      # result of a matrix job is 'success' only when every leg succeeded.
      - name: Fail unless every matrix leg succeeded
        if: needs.lint-and-test.result != 'success'
        run: exit 1
