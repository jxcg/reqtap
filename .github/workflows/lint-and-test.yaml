name: verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first failing version cancels the others and hides
      # whether the break is version-specific or universal.
      fail-fast: false
      matrix:
        # Every version pyproject.toml's requires-python claims to support.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies (Lint)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Lint
        run: ruff check src

      - name: Mypy (type check)
        run: mypy src

      - name: Run Test
        run: python -m pytest
